services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USERNAME}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: UTC
      PGTZ: UTC
    env_file:
      - .env
    ports:
      - "127.0.0.1:5436:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - chat-network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - chat-network

  app:
    build: .
    restart: unless-stopped
    # Порт не публикуется наружу: масштабируем за nginx.
    # Число реплик: `APP_REPLICAS=3` в .env или `docker compose up --scale app=3`.
    deploy:
      replicas: ${APP_REPLICAS:-1}
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DATABASE_URL: ${POSTGRES_URL}
      DATABASE_USERNAME: ${POSTGRES_USERNAME}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: UTC
      JWT_SECRET: ${JWT_SECRET}
      # В prod push включён по умолчанию: если сервисный аккаунт не положили,
      # приложение упадёт на старте (громко), а не потеряет уведомления молча.
      # Отключается явно: FCM_ENABLED=false.
      FCM_ENABLED: ${FCM_ENABLED:-true}
      REDIS_HOST: redis
      APP_CACHE_REDIS_ENABLED: "true"
      MINIO_URL: ${MINIO_URL:-http://minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_AVATAR_BUCKET: ${MINIO_AVATAR_BUCKET:-avatars}
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
    networks:
      # Уникальный алиас: сеть shared-minio общая с makeup, и service alias `app`
      # там конфликтует с app от makeup.
      chat-network:
        aliases:
          - chat-app
      shared-minio:
    extra_hosts:
      - "90.188.89.63:host-gateway"

  # Балансировщик: внешний порт остаётся 8086, внутри — на все реплики app.
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8086:80"
    volumes:
      # Каталог, а не файл: bind-mount файла держит inode и не видит замену.
      - ./deploy:/etc/nginx/conf.d:ro
    depends_on:
      - app
    networks:
      - chat-network

networks:
  # Нейтральная общая сеть с makeup для доступа к MinIO (создаётся на хосте
  # в deploy). chat больше не заходит в сеть makeup — нет коллизий алиасов.
  shared-minio:
    external: true
    name: shared-minio
  chat-network:
    driver: bridge

volumes:
  postgres_data:
