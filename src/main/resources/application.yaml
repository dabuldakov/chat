spring:
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/chat_db}
    username: ${DATABASE_USERNAME:admin}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration  # ← Проверьте этот путь
    table: flyway_schema_history
  mail:
    host: smtp.gmail.com
    port: 587
    username: your-email@gmail.com
    password: your-app-password
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
    protocol: smtp

minio:
  url: ${MINIO_URL:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  avatar-bucket: ${MINIO_AVATAR_BUCKET:avatars}
  attachment-bucket: ${MINIO_ATTACHMENT_BUCKET:attachments}

jwt:
  secret: ${JWT_SECRET:dev-insecure-secret-please-set-JWT_SECRET}
  expiration: 86400000  # 24 часа в миллисекундах
  refresh-expiration: 604800000  # 7 дней

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:*}

server:
  port: 8080
  error:
    include-message: always


# OpenAPI (Swagger) конфигурация
springdoc:
  api-docs:
    enabled: true
    path: /api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    try-it-out-enabled: true
    filter: true
    display-request-duration: true
    doc-expansion: none
  show-activator: false
  packages-to-scan: com.chat.server.controller
  paths-to-match: /api/**
  cache:
    disabled: true

# Firebase Cloud Messaging
fcm:
  service-account-file: firebase-service-account.json

logging:
  level:
    org.flywaydb: DEBUG
    org.springframework.boot.autoconfigure.flyway: DEBUG
