spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/chat_db}
    username: ${DATABASE_USERNAME:admin}
    password: ${DATABASE_PASSWORD:admin}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    table: flyway_schema_history
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
    protocol: smtp

minio:
  url: ${MINIO_URL:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  avatar-bucket: ${MINIO_AVATAR_BUCKET:avatars}
  attachment-bucket: ${MINIO_ATTACHMENT_BUCKET:attachments}

jwt:
  secret: ${JWT_SECRET:dev-insecure-secret-please-set-JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}          # 24 часа
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}  # 7 дней

app:
  cache:
    redis:
      # false — локальный Caffeine (dev/одна нода). true — общий Redis-кеш
      # (несколько нод: иначе @CacheEvict не виден другим инстансам).
      enabled: ${APP_CACHE_REDIS_ENABLED:false}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:*}
  presence:
    # Как часто клиент шлёт heartbeat, пока приложение на переднем плане.
    heartbeat-interval-seconds: ${PRESENCE_HEARTBEAT_SECONDS:15}
    # Окно «онлайна»: столько секунд последний heartbeat считается актуальным.
    online-ttl-seconds: ${PRESENCE_ONLINE_TTL_SECONDS:45}
    # Период PresenceSweeper (снимает флаг is_online у «зависших»).
    sweep-interval-ms: ${PRESENCE_SWEEP_INTERVAL_MS:60000}
    # Максимум UUID за один запрос batch-presence.
    max-batch-size: ${PRESENCE_MAX_BATCH_SIZE:200}

# Firebase Cloud Messaging. Пока enabled=false, push-уведомления — no-op,
# и приложение можно поднимать без сервисного аккаунта (dev/CI).
fcm:
  enabled: ${FCM_ENABLED:false}
  service-account-file: ${FCM_SERVICE_ACCOUNT_FILE:firebase-service-account.json}

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always

# OpenAPI (Swagger) конфигурация
springdoc:
  api-docs:
    enabled: true
    path: /api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    try-it-out-enabled: true
    filter: true
    display-request-duration: true
    doc-expansion: none
  show-activator: false
  packages-to-scan: com.chat.server
  paths-to-match: /api/**
  cache:
    disabled: true

logging:
  level:
    org.flywaydb: INFO
  structured:
    format:
      console: logstash

# Actuator: отдаём только health (и info). Health используется мониторингом
# (blackbox_exporter) для проверки доступности приложения и БД.
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  health:
    mail:
      enabled: false
