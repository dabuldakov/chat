# Прод: все секреты обязательны из окружения, без небезопасных дефолтов.
spring:
  datasource:
    # Без дефолтов: приложение не должно стартовать с admin/admin в проде.
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  jpa:
    show-sql: false
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}

# Приём токенов auth-service включён; отключается AUTH_OIDC_ENABLED=false.
auth:
  oidc:
    enabled: ${AUTH_OIDC_ENABLED:true}

app:
  cache:
    redis:
      # Несколько нод должны видеть общий кеш; отключается REDIS_ENABLED=false.
      enabled: ${APP_CACHE_REDIS_ENABLED:true}

server:
  error:
    # Не раскрываем внутренние сообщения об ошибках наружу.
    include-message: never
    include-binding-errors: never

logging:
  level:
    com.chat.server: INFO

# Swagger/OpenAPI в проде отключён: не раскрываем карту API.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
